# Production stack on one server. Lives in /opt/michy-flow next to .env (see .env.example).
name: michy-flow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Tuned for a 4 GB server shared with the API (OCR needs up to ~1 GB of it).
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_connections=60
      -c wal_compression=on
      -c log_min_duration_statement=500
    shm_size: 256mb
    # Only on the server itself (never the internet), so TablePlus can connect through an SSH tunnel.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/${GH_REPO}/api:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # One process only: background workers and startup migrations run inside it.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-1}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENV_NAME: production
      ALLOWED_ORIGINS: https://${DOMAIN}
      FRONTEND_BASE_URL: https://${DOMAIN}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      AUTO_MIGRATE: "true"
      RATE_LIMIT_ENABLED: "true"
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@michyconnect.in}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Michy Rubbers}
    mem_limit: 1800m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 4
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    image: ghcr.io/${GH_REPO}/web:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    logging: *logging

  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  pgdata:
  letsencrypt:
  certbot-www:
