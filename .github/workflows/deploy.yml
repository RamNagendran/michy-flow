name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: server
          - name: web
            context: client
    steps:
      - uses: actions/checkout@v5
      # The app's API address is baked in from DOMAIN; an empty one builds an app that cannot log in.
      - name: Check DOMAIN
        run: |
          if [ -z "${{ vars.DOMAIN }}" ]; then
            echo "::error::Set DOMAIN under Settings > Secrets and variables > Actions > Variables (repository level, not a secret)"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:latest
          build-args: |
            VITE_BACKEND_API=https://api.${{ vars.DOMAIN }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Copy stack files
        run: scp -r deploy/docker-compose.prod.yml deploy/scripts ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/michy-flow/
      - name: Pull and restart
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
             && sh /opt/michy-flow/scripts/deploy.sh ${{ github.sha }}; s=\$?; docker logout ghcr.io; exit \$s"
